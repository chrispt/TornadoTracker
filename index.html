<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self';
             style-src 'self' https://unpkg.com 'unsafe-inline';
             img-src 'self' data: https://*.tile.openstreetmap.org;
             font-src 'self' data: https://unpkg.com;
             connect-src 'self' https://api.weather.gov https://www.spc.noaa.gov https://mesonet.agron.iastate.edu;
             worker-src 'self';
             frame-ancestors 'none';
             base-uri 'self';
             form-action 'self'" />
  <title>TornadoTracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
  <link rel="stylesheet" href="./styles/variables.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/feed.css" />
  <link rel="stylesheet" href="./styles/detail.css" />
  <link rel="stylesheet" href="./styles/map.css" />
  <link rel="stylesheet" href="./styles/mobile.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" id="app-header"></header>

    <!-- Emergency banner — full-width red strip when one or more tornado
         emergencies are active. Hidden when empty. -->
    <div class="emergency-banner" id="emergency-banner" role="alert" aria-live="assertive" hidden></div>

    <!-- Stats bar -->
    <div class="stats-bar" id="stats-bar" aria-live="polite"></div>

    <!-- Sidebar: filters → scope → tabs → feed/search -->
    <div id="sidebar-resizer" class="resize-handle resize-handle--col"
      role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize · Double-click to reset"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar__filters">
        <div class="sidebar__section-label">Categories</div>
        <div class="sidebar__chips" id="type-filters" role="group" aria-label="Category filters"></div>
        <div class="sidebar__section-label">Filter by area</div>
        <div class="sidebar__scope">
          <div id="locations-host"></div>
          <div class="office-filter office-filter--collapsed" id="office-filter-host">
            <button type="button" class="office-filter__toggle" id="office-filter-toggle"
              aria-label="Filter by NWS Weather Forecast Office code">
              <span aria-hidden="true">+</span> Office
            </button>
            <div class="office-filter__input-wrap" hidden id="office-filter-input-wrap">
              <input type="text" id="office-filter" class="office-filter__input"
                placeholder="Office (e.g. KBMX)"
                aria-label="NWS Weather Forecast Office code" />
              <button type="button" class="office-filter__clear" id="office-filter-clear"
                aria-label="Clear office filter" title="Clear">&times;</button>
            </div>
          </div>
        </div>
      </div>
      <div class="sidebar__tabs" role="tablist">
        <button class="sidebar__tab sidebar__tab--active" data-tab="feed" role="tab" aria-selected="true">
          <span class="sidebar__tab-label">Feed</span>
          <span class="sidebar__tab-count" id="feed-tab-count" hidden></span>
        </button>
        <button class="sidebar__tab" data-tab="search" role="tab" aria-selected="false">
          <span class="sidebar__tab-label">Search</span>
          <span class="sidebar__tab-count" id="search-tab-count" hidden></span>
        </button>
        <button class="sidebar__tab sidebar__tab--mobile-only" data-tab="map" role="tab" aria-selected="false">
          <span class="sidebar__tab-label">Map</span>
        </button>
      </div>
      <div class="sidebar__content" id="sidebar-content">
        <div id="feed-container"></div>
        <div id="search-container" class="hidden"></div>
      </div>
    </div>

    <!-- Main panel: map + detail -->
    <div class="main-panel" id="main-panel">
      <div id="map-panel-wrapper" class="main-panel__map-wrapper">
        <div id="map-panel" class="main-panel__map"></div>
      </div>
      <div id="map-resizer" class="resize-handle resize-handle--row"
        role="separator" aria-orientation="horizontal" aria-label="Resize map" title="Drag to resize · Double-click to reset"></div>
      <div class="main-panel__detail" id="detail-panel"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
